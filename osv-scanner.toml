reason = "deepmerge@4.3.1 has no published patched release as of 2026-10-28. GitHub advisory data reports no first patched version, and npm view deepmerge version returns 4.3.1. Reachability evidence: pnpm why deepmerge resolves only through shadcn@4.22.1 and its registry CLI. This site imports only shadcn/tailwind.css in src/index.css; the installed package exports that path directly to a CSS file and has no install lifecycle script. The project scripts do not invoke the shadcn CLI or MCP server. Re-evaluate before adding a JavaScript shadcn import or CLI/MCP operation. Approved by AndrewDongminYoo's 2026-10-28 maintenance request to explicitly ignore vulnerabilities without a compatible upstream release. Re-evaluation owner: AndrewDongminYoo. Remove when a patched dependency release is available."

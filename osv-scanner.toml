reason = "picomatch@2.3.2 and picomatch@4.0.7 have no patched release as of 2026-11-18. GitHub advisory data reports no first patched version for the affected range <= 4.0.7, and npm view picomatch versions ends at 4.0.7. Reachability evidence: pnpm why picomatch resolves 4.0.7 only through the dev tools vite, knip, tinyglobby and fdir, which match globs from this repository's own configuration, and 2.3.2 only through shadcn -> fast-glob -> micromatch, whose CLI this site never runs because src/index.css imports only shadcn/tailwind.css. A grep of dist/ for picomatch and extglob finds no match, so the shipped site does not contain it. Re-evaluate before passing user-supplied glob patterns to any tool or adding a shadcn CLI/MCP operation. Approved on 2026-11-18. Remove when a picomatch release outside the affected range is available."

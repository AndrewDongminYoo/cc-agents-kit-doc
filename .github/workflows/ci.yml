name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.3.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check dependency graph visibility
        run: |
          if grep -q '^---$' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml must contain one application document"
            exit 1
          fi
      - name: Install Chromium for browser tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Setup Trunk
        uses: trunk-io/trunk-action/setup@e1234e67a86010d61ddac8d8ebf4b783e2ffd2fa # v2.0.0
      - name: Add Trunk launcher to PATH
        run: dirname "$TRUNK_PATH" >> "$GITHUB_PATH"
      - run: trunk check --all --no-fix --ci
      - run: pnpm check

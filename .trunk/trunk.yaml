# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.11.0
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - node@22.16.0
    - python@3.14.4
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  enabled:
    - actionlint@1.7.8
    - git-diff-check
actions:
  definitions:
    - id: project-quality-pre-commit
      description: Run the project lint and format checks before a commit.
      display_name: Project Quality Pre-Commit
      run: |
        #!/usr/bin/env bash
        set -euo pipefail
        pnpm lint
        pnpm format:check
      triggers:
        - git_hooks: [pre-commit]
    - id: project-quality-pre-push
      description: Run the complete project check before a push.
      display_name: Project Quality Pre-Push
      run: |
        #!/usr/bin/env bash
        set -euo pipefail
        pnpm check
      triggers:
        - git_hooks: [pre-push]
  disabled:
    - trunk-announce
    - trunk-upgrade-available
  enabled:
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
    # Project Specific Actions
    - project-quality-pre-commit
    - project-quality-pre-push
